<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Hit Breaker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="/">HIT BREAKER <span>by Miss Chocolate</span></a>
  <nav class="links" id="navLinks"></nav>
</header>
<div class="container">
  <h2>Leaderboard</h2>
  <div class="tabs">
    <button class="btn ghost active" data-t="">All Time</button>
    <button class="btn ghost" data-t="/daily">Today</button>
    <button class="btn ghost" data-t="/weekly">This Week</button>
  </div>
  <div class="card"><table>
    <thead><tr><th>#</th><th>Player</th><th>Best Score</th><th>Accuracy</th><th>Level</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
  </table></div>
</div>
<script src="/common.js"></script>
<script>
async function load(path) {
  const rows = await api('/api/leaderboard' + path);
  document.getElementById('rows').innerHTML = rows.length ? rows.map((r, i) => `
    <tr><td>${i + 1}</td><td>${esc(r.username)}</td><td>${r.best_score.toLocaleString()}</td>
    <td>${Number(r.best_accuracy).toFixed(1)}%</td><td>${r.level_reached}</td></tr>`).join('')
    : '<tr><td colspan="5">No scores yet — be the first!</td></tr>';
}
document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    load(b.dataset.t);
  };
});
refreshAuth().then(() => load(''));
</script>
</body>
</html>
