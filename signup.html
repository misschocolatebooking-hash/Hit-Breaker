<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Hit Breaker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="/">HIT BREAKER <span>by Miss Chocolate</span></a>
  <nav class="links" id="navLinks"></nav>
</header>
<div class="container" style="max-width:420px">
  <h2>Create Account</h2>
  <div id="msg" class="alert err hidden"></div>
  <div class="card">
    <label>Username</label><input id="username" autocomplete="username">
    <label>Email</label><input id="email" type="email" autocomplete="email">
    <label>Password (6+ characters)</label><input id="password" type="password" autocomplete="new-password">
    <button class="btn" id="go" style="width:100%">Sign Up</button>
    <p style="margin-top:12px">Already have one? <a href="/login.html">Login</a></p>
  </div>
</div>
<script src="/common.js"></script>
<script>
refreshAuth();
document.getElementById('go').onclick = async () => {
  try {
    await api('/api/auth/signup', 'POST', {
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    location.href = '/';
  } catch (e) { showAlert('msg', e.message); }
};
</script>
</body>
</html>
